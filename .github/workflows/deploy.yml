name: Deploy darmoz-dashboard

on:
  push: { branches: [main] }
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/darmoz-dashboard

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_API_ID=${{ vars.VITE_API_ID }}
            VITE_ENABLE_MOCKS=${{ vars.VITE_ENABLE_MOCKS }}
            VITE_TOKEN_REFRESH_INTERVAL_MS=${{ vars.VITE_TOKEN_REFRESH_INTERVAL_MS }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted   # runner de darmozcs/darmoz-dashboard
    steps:
      - run: |
          cd /opt/infra/services/darmoz-dashboard
          docker compose pull
          docker compose up -d
          docker image prune -f
