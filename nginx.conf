server {
    listen 80;
    server_name _;

    # Se sirve detrás de Traefik bajo /darmoz-admin (ver /opt/infra/services/darmoz-admin).
    location = /darmoz-admin {
        return 301 /darmoz-admin/;
    }

    location /darmoz-admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /darmoz-admin/index.html;
    }
}
