server {
    listen 80;
    server_name _;

    # Se sirve detrás de Traefik bajo /darmoz-dashboard (ver /opt/infra/services/darmoz-dashboard).
    location = /darmoz-dashboard {
        return 301 /darmoz-dashboard/;
    }

    location /darmoz-dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /darmoz-dashboard/index.html;
    }
}
